name: Deploy Code.gs to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Code.gs'
      - 'appsscript.json'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy new version
        run: clasp deploy --deploymentId ${{ secrets.CLASP_DEPLOYMENT_ID }} -d "auto-deploy from GitHub"
